<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor PDF</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.11.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --top:#2b2b2b;--bar:#323232;--ctx:#2a2a2a;--panel:#262626;--view:#1d1d1d;--line:#3d3d3d;
  --tx:#e6e6e6;--tx2:#a8a8a8;--hov:#3f3f3f;--act:#4b4b4b;--acc:#3b8cff;--acc2:#1f6fe0;--danger:#e5484d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--view);color:var(--tx);font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:grid;grid-template-rows:42px 50px auto 1fr;height:100vh}
/* barra superior */
#top{background:var(--top);display:flex;align-items:stretch;justify-content:space-between;border-bottom:1px solid #1a1a1a}
.tabs{display:flex;align-items:stretch}
.tab{background:none;border:0;padding:0 16px;color:var(--tx2);font-size:15px;cursor:pointer;display:flex;align-items:center;gap:10px;border-right:1px solid #1a1a1a}
.tab:hover{color:#fff;background:#333}
.tab.on{color:#fff}
.tab.doc{background:#3a3a3a;color:#fff;min-width:200px;max-width:320px;justify-content:space-between}
.tab.doc span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab.doc button{background:none;border:0;cursor:pointer;color:#bbb;font-size:16px;padding:2px 4px;border-radius:3px}
.tab.doc button:hover{background:#555;color:#fff}
.tr{display:flex;align-items:center;gap:6px;padding-right:12px}
/* toolbar */
#toolbar{background:var(--bar);display:flex;align-items:center;padding:0 8px;gap:2px;border-bottom:1px solid #1a1a1a;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ib{background:none;border:0;width:38px;height:38px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#d0d0d0;flex:none;position:relative}
.ib:hover{background:var(--hov);color:#fff}
.ib.on{color:var(--acc);background:#2f3a4a}
.ib:disabled{opacity:.35;cursor:default;background:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 8px;flex:none}
.grow{flex:1 1 auto;min-width:8px}
.pnum{display:flex;align-items:center;gap:6px;color:var(--tx2);flex:none}
.pnum input{width:42px;background:#1f1f1f;border:1px solid #444;border-radius:4px;color:#fff;text-align:center;padding:4px 2px}
#zoomSel{background:#1f1f1f;border:1px solid #444;color:#fff;border-radius:4px;padding:5px 4px;flex:none}
/* barra contextual */
#ctx{background:var(--ctx);border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:4px;padding:0 10px;min-height:0;overflow-x:auto;scrollbar-width:thin}
#ctx:not(:empty){min-height:46px}
.ctitle{font-weight:600;margin-right:10px;white-space:nowrap;color:#fff}
.tb{background:none;border:0;border-radius:5px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#ddd;white-space:nowrap;flex:none}
.tb:hover{background:var(--hov)}
.tb.on{background:#2f3a4a;color:#7fb4ff}
.tb.pri{background:var(--acc2);color:#fff}
.tb.pri:hover{background:var(--acc)}
.props{display:flex;align-items:center;gap:6px;margin-left:auto;padding-left:12px;flex:none}
.props select,.props input[type=number]{background:#1f1f1f;border:1px solid #444;color:#fff;border-radius:4px;padding:4px}
.props input[type=number]{width:56px}
.props input[type=color]{width:30px;height:28px;border:1px solid #444;border-radius:4px;background:#1f1f1f;padding:2px;cursor:pointer}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.sw.on{border-color:#fff}
.tog{min-width:30px;justify-content:center;font-weight:700}
/* principal */
#main{display:flex;min-height:0;position:relative}
#left{width:170px;background:var(--panel);border-right:1px solid #1a1a1a;display:flex;flex-direction:column;flex:none}
#left.closed{display:none}
.lh{padding:10px 12px;color:var(--tx2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #1a1a1a}
#thumbs{overflow:auto;flex:1;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.th{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px;border-radius:6px;border:2px solid transparent}
.th:hover{background:#303030}
.th.on{border-color:var(--acc)}
.th.dov{border-color:#7dc456}
.th .tc{min-height:60px;background:#fff;box-shadow:0 1px 4px #0008;display:flex}
.th span{font-size:11px;color:var(--tx2)}
.edge{width:14px;background:var(--panel);border:0;color:#bbb;cursor:pointer;flex:none;font-size:12px;padding:0;border-right:1px solid #1a1a1a;border-left:1px solid #1a1a1a}
.edge:hover{background:#333;color:#fff}
#viewer{flex:1;overflow:auto;position:relative;background:var(--view)}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 24px 60px;min-width:min-content}
.pg{position:relative;background:#fff;box-shadow:0 2px 10px #000a;flex:none;overflow:hidden}
.pg .cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;left:0;top:0;transform-origin:0 0}
#right{width:270px;background:var(--panel);border-left:1px solid #1a1a1a;display:flex;flex-direction:column;flex:none}
#right.closed{display:none}
#tsearch{margin:14px 14px 10px;background:#1c1c1c;border:1px solid #444;border-radius:4px;color:#fff;padding:9px 12px;font-size:14px}
#tlist{overflow:auto;padding:4px 8px 20px}
.tool{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:11px 12px;border-radius:6px;cursor:pointer;font-size:15px;color:#e8e8e8;text-align:left}
.tool:hover{background:#333}
.tool.on{background:#2f3a4a}
.tool svg{flex:none}
/* inicio */
#home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px}
.hcard{max-width:640px;width:100%;text-align:center}
.drop{border:2px dashed #555;border-radius:14px;padding:46px 30px;background:#242424;cursor:pointer;transition:.15s}
.drop:hover,.drop.dov{border-color:var(--acc);background:#232b38}
.drop h2{margin:14px 0 6px;font-weight:600;font-size:22px}
.drop p{color:var(--tx2);margin:0 0 18px}
.qrow{display:flex;gap:12px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.qbtn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.qbtn:hover{background:#333;border-color:#555}
/* elementos */
.it{position:absolute;--o:calc(1px * var(--iz,1))}
.it.sel{outline:var(--o) solid var(--acc);outline-offset:calc(2px * var(--iz,1))}
.ov:not(.ro) .it:hover{outline:var(--o) dashed #6aa5ff;outline-offset:calc(2px * var(--iz,1))}
.ov:not(.ro) .it.sel:hover{outline-style:solid}
.ov.ro .it{pointer-events:none}
.ov.ro .it.t-note{pointer-events:auto}
.tx{outline:none;white-space:pre;line-height:1.2;min-width:4px;min-height:1em;cursor:text}
.t-whiteout,.t-redact{box-shadow:none}
.t-redact{background:#000;outline:var(--o) solid #e5484d!important}
.t-highlight{mix-blend-mode:multiply;opacity:.45}
.t-image img,.t-image canvas{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.it svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ctl{position:absolute;display:none;transform:scale(var(--iz,1));z-index:3}
.it.sel>.ctl,.ov:not(.ro) .it:hover>.ctl{display:flex}
.xb{right:-12px;top:-12px;transform-origin:100% 0}
.xb button,.hd{width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:14px;line-height:22px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0008}
.hdw{left:-12px;top:-12px;transform-origin:0 0}
.hd{background:var(--acc2);cursor:move}
.rs{right:-6px;bottom:-6px;transform-origin:100% 100%}
.rs i{width:12px;height:12px;background:#fff;border:2px solid var(--acc);border-radius:2px;cursor:nwse-resize;display:block}
.t-note .nic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:#ffd23f;border-radius:4px;box-shadow:0 1px 3px #0006;cursor:pointer;color:#5a4500}
.pop{position:absolute;left:28px;top:0;width:220px;background:#fff7c2;border:1px solid #d6c35a;border-radius:6px;box-shadow:0 6px 18px #0007;z-index:5;color:#222;font-size:12px;transform:scale(var(--iz,1));transform-origin:0 0}
.pop .ph{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#ffe56b;border-radius:6px 6px 0 0;font-weight:600}
.pop .ph button{background:none;border:0;cursor:pointer;font-size:14px}
.pop textarea{width:100%;height:110px;border:0;background:transparent;resize:vertical;padding:8px;font:12px/1.4 inherit;outline:none}
.hit{position:absolute;cursor:text;border-radius:1px}
.hit:hover{outline:1px solid #3b8cff;background:#3b8cff22}
.shit{position:absolute;background:#ffb30066;pointer-events:none;mix-blend-mode:multiply}
.shit.cur{background:#ff6a0099;outline:1px solid #ff6a00}
.prev{position:absolute;border:1px dashed var(--acc);background:#3b8cff18;pointer-events:none}
/* cursores */
#viewer.m-hand{cursor:grab}
#viewer.m-hand.drag{cursor:grabbing}
#viewer.m-text .pg,#viewer.m-date .pg{cursor:text}
#viewer.m-draw .pg,#viewer.m-whiteout .pg,#viewer.m-highlight .pg,#viewer.m-underline .pg,#viewer.m-strike .pg,#viewer.m-rect .pg,#viewer.m-ellipse .pg,#viewer.m-line .pg,#viewer.m-redact .pg{cursor:crosshair}
#viewer.m-note .pg,#viewer.m-check .pg,#viewer.m-cross .pg,#viewer.m-place .pg{cursor:copy}
#viewer.m-hand .pg *{pointer-events:none}
/* organizar */
#org{padding:0 0 40px}
.orgbar{position:sticky;top:0;z-index:4;background:#262626;border-bottom:1px solid #1a1a1a;display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px;align-items:center}
.grid{display:flex;flex-wrap:wrap;gap:22px;padding:24px}
.card{width:180px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:8px;border:2px solid transparent;position:relative;cursor:grab}
.card:hover{background:#2a2a2a}
.card.on{border-color:var(--acc);background:#232b38}
.card.dov{border-color:#7dc456}
.card .cc{height:200px;display:flex;align-items:center;justify-content:center}
.card .cc canvas{box-shadow:0 2px 8px #000a;background:#fff;max-width:160px;max-height:200px}
.card .cact{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;gap:2px;background:#1b1b1b;border-radius:6px;padding:2px;box-shadow:0 2px 6px #000a}
.card:hover .cact{display:flex}
.card .cact .ib{width:30px;height:30px}
.card input{position:absolute;top:10px;left:10px;width:18px;height:18px;accent-color:var(--acc)}
.card .nm{font-size:12px;color:var(--tx2)}
/* buscar */
#find{position:absolute;top:96px;right:290px;z-index:30;background:#2d2d2d;border:1px solid #444;border-radius:8px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:0 8px 24px #000a}
#find input{background:#1c1c1c;border:1px solid #555;color:#fff;border-radius:4px;padding:6px 8px;width:220px}
#find span{color:var(--tx2);min-width:60px;text-align:center;font-size:12px}
/* modales */
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:#2b2b2b;border:1px solid #444;border-radius:12px;box-shadow:0 20px 60px #000c;width:min(600px,100%);max-height:92vh;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #3a3a3a}
.dh h3{margin:0;font-size:16px;font-weight:600}
.db{padding:16px 18px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #3a3a3a}
.btn{background:#3a3a3a;border:1px solid #4a4a4a;border-radius:6px;padding:8px 16px;cursor:pointer}
.btn:hover{background:#454545}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.pri:hover{background:var(--acc)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{color:var(--tx2);font-size:12px}
.fld input[type=text],.fld input[type=password],.fld input[type=number],.fld select,.fld textarea{background:#1c1c1c;border:1px solid #4a4a4a;color:#fff;border-radius:6px;padding:8px 10px;font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.fld{flex:1;min-width:120px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.note{color:var(--tx2);font-size:12px;background:#232323;border-radius:6px;padding:10px;margin-top:6px}
.stabs{display:flex;gap:4px;margin-bottom:12px}
.stabs button{background:#222;border:1px solid #444;border-radius:6px;padding:7px 14px;cursor:pointer}
.stabs button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
#sigPad{background:#fff;border-radius:8px;width:100%;height:190px;touch-action:none;cursor:crosshair;display:block}
.sigfonts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sigfonts button{background:#fff;color:#111;border:2px solid transparent;border-radius:6px;padding:6px 12px;font-size:32px;cursor:pointer;text-align:left;min-height:56px}
.sigfonts button.on{border-color:var(--acc)}
.siglist{display:flex;gap:6px;align-items:center}
.siglist button{background:#fff;border:1px solid #666;border-radius:4px;height:32px;padding:2px 6px;cursor:pointer;display:flex;align-items:center}
.siglist img{max-height:26px;max-width:90px}
.sigdel{background:none!important;border:0!important;color:#999;font-size:13px;padding:0 4px!important}
/* otros */
#busy{position:fixed;inset:0;background:#0009;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:15px}
.spin{width:42px;height:42px;border:4px solid #555;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;border:1px solid #444;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;z-index:95;pointer-events:none;box-shadow:0 6px 20px #000a}
#toast.show{opacity:1;transform:translateX(-50%)}
.dropall{position:fixed;inset:0;z-index:80;background:#1f6fe055;border:4px dashed var(--acc);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;pointer-events:none}
kbd{background:#1c1c1c;border:1px solid #555;border-radius:4px;padding:1px 6px;font-size:12px}
table.keys td{padding:4px 10px 4px 0}
@media (max-width:900px){#right{width:220px}#left{width:130px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="tabs">
      <button class="tab" id="tabHome">Inicio</button>
      <button class="tab" id="tabTools">Herramientas</button>
      <div class="tab doc" id="docTab" hidden><span id="docName"></span><button id="closeDoc" title="Cerrar documento">✕</button></div>
    </div>
    <div class="tr"><button class="ib" id="helpBtn" title="Ayuda y atajos" data-i="help"></button></div>
  </header>

  <div id="toolbar">
    <button class="ib" data-act="open" title="Abrir (Ctrl+O)" data-i="folder"></button>
    <button class="ib" data-act="save" title="Guardar (Ctrl+S)" data-i="save"></button>
    <button class="ib" data-act="saveas" title="Guardar como (Ctrl+Mayús+S)" data-i="download"></button>
    <button class="ib" data-act="print" title="Imprimir (Ctrl+P)" data-i="print"></button>
    <button class="ib" data-act="find" title="Buscar texto (Ctrl+F)" data-i="search"></button>
    <div class="grow"></div>
    <button class="ib" data-act="prev" title="Página anterior" data-i="up"></button>
    <button class="ib" data-act="next" title="Página siguiente" data-i="down"></button>
    <div class="pnum"><input id="pgIn" value="0"><span id="pgTot">/ 0</span></div>
    <div class="sep"></div>
    <button class="ib" data-act="zout" title="Alejar" data-i="zout"></button>
    <button class="ib" data-act="zin" title="Acercar" data-i="zin"></button>
    <select id="zoomSel" title="Zoom">
      <option value="width">Ajustar ancho</option><option value="page">Página completa</option>
      <option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option>
      <option value="custom" hidden id="zCustom">100%</option>
    </select>
    <div class="sep"></div>
    <button class="ib on" data-tool="select" title="Seleccionar (V)" data-i="cursor"></button>
    <button class="ib" data-tool="hand" title="Mano (H)" data-i="hand"></button>
    <div class="sep"></div>
    <button class="ib" data-tool="note" title="Agregar nota" data-i="comment"></button>
    <button class="ib" data-tool="highlight" title="Resaltar" data-i="highlight"></button>
    <button class="ib" data-tool="draw" title="Dibujar a mano" data-i="pen"></button>
    <button class="ib" data-act="sign" title="Firmar" data-i="sign"></button>
    <div class="sep"></div>
    <button class="ib" data-act="delpage" title="Eliminar página actual" data-i="trash"></button>
    <button class="ib" data-act="rotpage" title="Rotar página actual" data-i="rotcw"></button>
    <div class="sep"></div>
    <button class="ib" data-act="undo" title="Deshacer (Ctrl+Z)" data-i="undo" id="bUndo"></button>
    <button class="ib" data-act="redo" title="Rehacer (Ctrl+Y)" data-i="redo" id="bRedo"></button>
    <div class="grow"></div>
    <button class="ib" data-act="protect" title="Proteger con contraseña" data-i="lock"></button>
    <button class="ib" data-act="export" title="Exportar PDF" data-i="export"></button>
  </div>

  <div id="ctx"></div>

  <div id="main">
    <aside id="left"><div class="lh">Miniaturas</div><div id="thumbs"></div></aside>
    <button class="edge" id="lt" title="Mostrar u ocultar miniaturas">‹</button>
    <section id="viewer" class="m-select">
      <div id="home">
        <div class="hcard">
          <div class="drop" id="dropZone">
            <div data-i="filePlus" data-s="54" style="color:#f06b6b"></div>
            <h2>Abre un PDF para comenzar</h2>
            <p>Arrastra aquí tu archivo o haz clic para buscarlo en tu computadora</p>
            <button class="btn pri">Seleccionar archivo</button>
          </div>
          <div class="qrow">
            <button class="qbtn" data-tool-open="create"><span data-i="filePlus" style="color:#f06b6b"></span>Crear PDF desde imágenes</button>
            <button class="qbtn" data-tool-open="combine"><span data-i="merge" style="color:#9c7cf4"></span>Combinar archivos</button>
          </div>
        </div>
      </div>
      <div id="pages" hidden></div>
      <div id="org" hidden></div>
    </section>
    <button class="edge" id="rt" title="Mostrar u ocultar herramientas">›</button>
    <aside id="right"><input id="tsearch" placeholder="Buscar herramientas"><div id="tlist"></div></aside>
  </div>
</div>

<div id="find" hidden>
  <input id="findIn" placeholder="Buscar en el documento">
  <span id="findCnt"></span>
  <button class="ib" id="findPrev" data-i="up" title="Anterior"></button>
  <button class="ib" id="findNext" data-i="down" title="Siguiente"></button>
  <button class="ib" id="findClose" data-i="x" title="Cerrar"></button>
</div>
<div id="busy" hidden><div class="spin"></div><span id="busyMsg">Procesando...</span></div>
<div id="toast"></div>

<script>
/* ======================== utilidades ======================== */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const {PDFDocument,StandardFonts,rgb,degrees,LineCapStyle,PDFName,PDFHexString,BlendMode}=PDFLib;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const viewer=$('#viewer');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;

/* ======================== carga de documentos ======================== */
async function addSrc(bytes){
  let pwd;
  const task=pdfjsLib.getDocument({data:bytes.slice()});
  task.onPassword=(cb,reason)=>{const p=prompt(reason===2?'Contraseña incorrecta. Intenta de nuevo:':'Este PDF está protegido. Escribe la contraseña:');if(p===null){task.destroy();return}pwd=p;cb(p)};
  const doc=await task.promise;
  st.srcs.push({bytes,doc,pwd});return st.srcs.length-1;
}
async function pagesOf(si){
  const d=st.srcs[si].doc,out=[];
  for(let i=0;i<d.numPages;i++){const p=await d.getPage(i+1);const vp=p.getViewport({scale:1});
    out.push({id:nid(),s:si,i,rot:0,base:{w:vp.width,h:vp.height,r:p.rotate%360},items:[],ocr:null,edited:[]})}
  return out;
}
async function imageToPdf(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const doc=await PDFDocument.create();
  let emb;
  if(/jpe?g/i.test(file.type)) emb=await doc.embedJpg(await file.arrayBuffer());
  else{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
    emb=await doc.embedPng(await (await fetch(c.toDataURL('image/png'))).arrayBuffer())}
  let w=img.naturalWidth*.75,h=img.naturalHeight*.75;const sc=Math.min(1,842/Math.max(w,h));w*=sc;h*=sc;
  const pg=doc.addPage([w,h]);pg.drawImage(emb,{x:0,y:0,width:w,height:h});
  URL.revokeObjectURL(url);
  return new Uint8Array(await doc.save());
}
const blankCache={};
async function blankSrc(w,h){const k=Math.round(w)+'x'+Math.round(h);if(blankCache[k]!=null)return blankCache[k];
  const d=await PDFDocument.create();d.addPage([w,h]);const si=await addSrc(new Uint8Array(await d.save()));blankCache[k]=si;return si}

async function filesToPages(files){
  const out=[];
  for(const f of files){
    try{
      let bytes;
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) bytes=new Uint8Array(await f.arrayBuffer());
      else if(f.type.startsWith('image/')) bytes=await imageToPdf(f);
      else{toast('Formato no compatible: '+f.name);continue}
      const si=await addSrc(bytes);out.push(...await pagesOf(si));
    }catch(e){console.error(e);toast('No se pudo abrir '+f.name)}
  }
  return out;
}
function resetDoc(){
  st.srcs=[];st.pages=[];st.imgs={};st.hist=[];st.fut=[];st.sel=null;st.pi=0;st.security=null;st.meta={};st.handle=null;st.dirty=false;
  for(const k in blankCache)delete blankCache[k];
  pageEls.forEach(E=>E.el.remove());pageEls.clear();vis.clear();tcCache.clear();thumbCache.clear();sampCache.clear();
  $('#pages').innerHTML='';$('#thumbs').innerHTML='';closeFind();
}
async function openNew(files,handle){
  if(!files.length)return;
  if(st.dirty&&!confirm('Hay cambios sin guardar. ¿Descartarlos y abrir otro archivo?'))return;
  busy('Abriendo documento...');
  try{
    resetDoc();
    const pages=await filesToPages(files);
    if(!pages.length){busy(false);showHome();return}
    st.pages=pages;st.handle=handle||null;
    st.name=files.length===1&&/\.pdf$/i.test(files[0].name)?files[0].name:(files.length===1?files[0].name.replace(/\.[^.]+$/,'')+'.pdf':'Documento combinado.pdf');
    st.cur=snap();st.dirty=files.length>1||!/\.pdf$/i.test(files[0].name);
    showDoc();st.fit='width';syncPages();applyFit();updateUndo();
  }finally{busy(false)}
}
async function appendFiles(files,at){
  if(!files.length)return;
  if(!hasDoc())return openNew(files);
  busy('Agregando páginas...');
  try{const pages=await filesToPages(files);if(!pages.length)return;
    const pos=at==null?st.pages.length:at;st.pages.splice(pos,0,...pages);commit();syncPages();if(st.view==='org')renderOrg();toast(pages.length+' página(s) agregada(s)')}
  finally{busy(false)}
}
async function openDialog(){
  if(window.showOpenFilePicker){
    try{const [h]=await showOpenFilePicker({types:[{description:'PDF',accept:{'application/pdf':['.pdf']}},{description:'Imágenes',accept:{'image/*':['.png','.jpg','.jpeg','.webp','.gif','.bmp']}}]});
      const f=await h.getFile();return openNew([f],/\.pdf$/i.test(f.name)?h:null)}
    catch(e){if(e.name==='AbortError')return}
  }
  const fs=await pickFiles('.pdf,application/pdf,image/*',false);openNew(fs);
}

function commit(){if(st.cur!=null)st.hist.push(st.cur);st.cur=snap();st.fut=[];if(st.hist.length>100)st.hist.shift();st.dirty=true;updateUndo()}
function restore(s){const o=JSON.parse(s);st.pages=o.pages;st.sel=null;st.pi=Math.min(st.pi,st.pages.length-1);syncPages(true);if(st.view==='org')renderOrg();updateProps()}
function undo(){if(document.activeElement)document.activeElement.blur();if(!st.hist.length)return;st.fut.push(st.cur);st.cur=st.hist.pop();restore(st.cur);st.dirty=true;updateUndo()}
function redo(){if(!st.fut.length)return;st.hist.push(st.cur);st.cur=st.fut.pop();restore(st.cur);st.dirty=true;updateUndo()}
function updateUndo(){$('#bUndo').disabled=!st.hist.length;$('#bRedo').disabled=!st.fut.length;document.title=(st.dirty?'• ':'')+(hasDoc()?st.name+' – ':'')+'Editor PDF'}

const obs=new IntersectionObserver(es=>es.forEach(e=>{const id=+e.target.dataset.id;vis.set(id,e.isIntersecting);if(e.isIntersecting){const p=pageById(id);if(p){renderPage(p);if(st.tool==='editText')renderHits(p)}}}),{root:viewer,rootMargin:'900px 0px'});
function makePageEl(p){
  const el=document.createElement('div');el.className='pg';el.dataset.id=p.id;
  const cv=document.createElement('canvas');cv.className='cv';
  const ov=document.createElement('div');ov.className='ov';
  el.append(cv,ov);
  el.addEventListener('mousedown',e=>pageDown(e,pageById(p.id)));
  const E={el,canvas:cv,ov,key:null};pageEls.set(p.id,E);obs.observe(el);return E;
}
function ovTransform(p){const z=st.z,{w:bw,h:bh}=p.base;
  switch(p.rot){case 90:return `translate(${bh*z}px,0) rotate(90deg) scale(${z})`;case 180:return `translate(${bw*z}px,${bh*z}px) rotate(180deg) scale(${z})`;case 270:return `translate(0,${bw*z}px) rotate(270deg) scale(${z})`;default:return `scale(${z})`}}
function sizePage(p){const E=pageEls.get(p.id);if(!E)return;const d=disp(p);
  E.el.style.width=d.w*st.z+'px';E.el.style.height=d.h*st.z+'px';
  E.ov.style.width=p.base.w+'px';E.ov.style.height=p.base.h+'px';E.ov.style.transform=ovTransform(p);E.ov.style.setProperty('--iz',1/st.z);
  E.ov.classList.toggle('ro',!['select','text','editText'].includes(st.tool));
  if(vis.get(p.id))renderPage(p);
}
function syncPages(full){
  const box=$('#pages'),ids=new Set(st.pages.map(p=>p.id));
  for(const [id,E] of [...pageEls]) if(!ids.has(id)){obs.unobserve(E.el);E.el.remove();pageEls.delete(id);vis.delete(id)}
  st.pages.forEach((p,k)=>{let E=pageEls.get(p.id),fresh=false;if(!E){E=makePageEl(p);fresh=true}
    if(box.children[k]!==E.el)box.insertBefore(E.el,box.children[k]||null);
    sizePage(p);if(fresh||full!==false)renderItems(p)});
  if(st.fit)applyFit(true);
  syncThumbs();updateNav();updateUndo();
}
async function renderPage(p){
  const E=pageEls.get(p.id);if(!E)return;
  const rot=(p.base.r+p.rot)%360,key=st.z+'|'+rot;if(E.key===key||E.busy===key)return;
  E.busy=key;if(E.task){try{E.task.cancel()}catch(e){}}
  try{
    const pg=await st.srcs[p.s].doc.getPage(p.i+1);
    const dpr=window.devicePixelRatio||1,v1=pg.getViewport({scale:1,rotation:rot});
    let sc=st.z*dpr;const max=16e6;if(v1.width*v1.height*sc*sc>max)sc=Math.sqrt(max/(v1.width*v1.height));
    const vp=pg.getViewport({scale:sc,rotation:rot});
    const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.className='cv';
    const task=pg.render({canvasContext:c.getContext('2d'),viewport:vp});E.task=task;
    await task.promise;
    if(E.busy!==key)return;E.canvas.replaceWith(c);E.canvas=c;E.key=key;E.busy=null;
  }catch(e){if(E.busy===key)E.busy=null;if(e&&e.name!=='RenderingCancelledException')console.warn(e)}
}
function renderVisible(){st.pages.forEach(p=>{if(vis.get(p.id))renderPage(p)})}
function screenToBase(p,e){const E=pageEls.get(p.id),r=E.el.getBoundingClientRect(),a=(e.clientX-r.left)/st.z,b=(e.clientY-r.top)/st.z,{w:bw,h:bh}=p.base;
  switch(p.rot){case 90:return{x:b,y:bh-a};case 180:return{x:bw-a,y:bh-b};case 270:return{x:bw-b,y:a};default:return{x:a,y:b}}}
function baseToDisp(p,x,y){const {w:bw,h:bh}=p.base;switch(p.rot){case 90:return{x:bh-y,y:x};case 180:return{x:bw-x,y:bh-y};case 270:return{x:y,y:bw-x};default:return{x,y}}}

/* zoom */
function setZoom(z,fit){st.fit=fit||null;z=clamp(z,.1,6);const v=viewer,ry=(v.scrollTop+v.clientHeight/2)/Math.max(1,v.scrollHeight),rx=(v.scrollLeft+v.clientWidth/2)/Math.max(1,v.scrollWidth);
  st.z=z;st.pages.forEach(sizePage);v.scrollTop=ry*v.scrollHeight-v.clientHeight/2;v.scrollLeft=rx*v.scrollWidth-v.clientWidth/2;updateZoomUI();renderVisible()}
function applyFit(quiet){if(!hasDoc())return;const v=viewer;let z;
  const mw=Math.max(...st.pages.map(p=>disp(p).w));const zw=(v.clientWidth-60)/mw;
  if(st.fit==='page'){const p=st.pages[st.pi]||st.pages[0];z=Math.min(zw,(v.clientHeight-44)/disp(p).h)}else z=zw;
  z=clamp(z,.1,6);if(quiet&&Math.abs(z-st.z)<.001){updateZoomUI();return}setZoom(z,st.fit)}
function updateZoomUI(){const s=$('#zoomSel'),c=$('#zCustom');if(st.fit){s.value=st.fit}else{const m=[...s.options].find(o=>Math.abs(+o.value-st.z)<.001);if(m)s.value=m.value;else{c.textContent=Math.round(st.z*100)+'%';c.value='custom';s.value='custom'}}}
const zSteps=[.25,.33,.5,.67,.75,.9,1,1.1,1.25,1.5,1.75,2,2.5,3,4,5,6];

function getThumb(p,w){const rot=(p.base.r+p.rot)%360,key=`${p.s}:${p.i}:${rot}:${w}`;
  if(!thumbCache.has(key))thumbCache.set(key,(async()=>{const pg=await st.srcs[p.s].doc.getPage(p.i+1);const v1=pg.getViewport({scale:1,rotation:rot});
    const vp=pg.getViewport({scale:w/v1.width*1.5,rotation:rot});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c})());
  return thumbCache.get(key)}
async function fillThumb(box,p,w){const src=await getThumb(p,w);const c=document.createElement('canvas');c.width=src.width;c.height=src.height;c.getContext('2d').drawImage(src,0,0);
  c.style.width=w+'px';c.style.height=(src.height/src.width*w)+'px';box.innerHTML='';box.append(c)}
const tobs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._done){const p=pageById(+e.target.dataset.id);if(p){e.target._done=1;fillThumb(e.target.querySelector('.tc'),p,110)}}}),{root:$('#thumbs'),rootMargin:'300px'});
let dragId=null;
function dndReorder(el,id,after){
  el.draggable=true;
  el.addEventListener('dragstart',e=>{dragId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','pg')});
  el.addEventListener('dragend',()=>{dragId=null;$$('.dov').forEach(x=>x.classList.remove('dov'))});
  el.addEventListener('dragover',e=>{if(dragId==null)return;e.preventDefault();e.stopPropagation();el.classList.add('dov')});
  el.addEventListener('dragleave',()=>el.classList.remove('dov'));
  el.addEventListener('drop',e=>{if(dragId==null)return;e.preventDefault();e.stopPropagation();el.classList.remove('dov');
    const from=st.pages.findIndex(p=>p.id===dragId),to=st.pages.findIndex(p=>p.id===id);dragId=null;if(from<0||to<0||from===to)return;
    st.pages.splice(to,0,st.pages.splice(from,1)[0]);commit();syncPages(false);after&&after();toast('Página movida')});
}
function syncThumbs(){const box=$('#thumbs');box.innerHTML='';
  st.pages.forEach((p,k)=>{const d=document.createElement('div');d.className='th'+(k===st.pi?' on':'');d.dataset.id=p.id;d.title='Página '+(k+1)+' (arrastra para mover)';
    d.innerHTML=`<div class="tc" style="width:110px;height:${disp(p).h/disp(p).w*110}px"></div><span>${k+1}</span>`;
    d.onclick=()=>goPage(st.pages.indexOf(p));dndReorder(d,p.id);box.append(d);tobs.observe(d)})}

const svgNS='http://www.w3.org/2000/svg';
function svgEl(w,h,inner){const s=document.createElementNS(svgNS,'svg');s.setAttribute('width',Math.max(1,w));s.setAttribute('height',Math.max(1,h));s.innerHTML=inner;return s}
function textStyle(t,it){const F=FONTS[it.font]||FONTS.Helvetica;t.style.fontFamily=F.css;t.style.fontSize=it.size+'px';t.style.color=it.color;t.style.fontWeight=it.bold?'700':'400';t.style.fontStyle=it.italic?'italic':'normal'}
function itemEl(p,it){

      if(it.angle){d.style.transform=`rotate(${it.angle}deg)`;d.style.transformOrigin='0 0'}

      d.append(t);const hw=document.createElement('div');hw.className='ctl hdw';hw.innerHTML=`<button class="hd" title="Mover">${ic('move',13)}</button>`;d.append(hw);break}

  return d;
}
function removeItem(p,it){p.items=p.items.filter(i=>i.id!==it.id);const el=$(`.it[data-id="${it.id}"]`);el&&el.remove();if(st.sel&&st.sel.iid===it.id)select(null);commit()}
function addItem(p,it,noCommit){p.items.push(it);const E=pageEls.get(p.id);E.ov.append(itemEl(p,it));if(!noCommit)commit();return it}
function itemDown(e,p,it,d){
  if(e.button!==0)return;
  if(!['select','text','editText'].includes(st.tool)&&it.type!=='note')return;
  if(e.target.closest('.pop')){e.stopPropagation();return}
  if(e.target.closest('.xb')){e.preventDefault();e.stopPropagation();removeItem(p,it);return}
  if(it.type==='text'&&e.target.closest('.tx')){e.stopPropagation();if(!st.sel||st.sel.iid!==it.id)select(p.id,it.id);return}
  e.preventDefault();e.stopPropagation();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  select(p.id,it.id);
  const s0=screenToBase(p,e),o={x:it.x,y:it.y,w:it.w,h:it.h},rs=!!e.target.closest('.rs');let moved=false;
  const mv=ev=>{const s=screenToBase(p,ev),dx=s.x-s0.x,dy=s.y-s0.y;if(Math.abs(dx)+Math.abs(dy)>.8)moved=true;if(!moved)return;
    if(rs){let w=Math.max(4,o.w+dx),h=Math.max(4,o.h+dy);if(['image','check','cross'].includes(it.type)&&!ev.shiftKey)h=w*o.h/o.w;it.w=w;it.h=h;

  const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);if(moved){commit();refreshItem(p,it)}else if(it.type==='note')openNote(p,it)};
  addEventListener('mousemove',mv);addEventListener('mouseup',up);
}
function openNote(p,it){const d=$(`.it[data-id="${it.id}"]`);if(!d)return;const ex=d.querySelector('.pop');if(ex){ex.remove();return}

function newText(p,x,y,text=''){const S=st.style;const it={id:nid(),type:'text',x,y,text,font:S.font,size:S.size,color:S.tcolor,bold:S.bold,italic:S.italic};

const KEEP=['highlight','underline','strike','draw','redact','whiteout','rect','ellipse','line','text','check','cross'];
function pageDown(e,p){
  if(e.button!==0||!p)return;const tool=st.tool;if(tool==='hand')return;
  const b=screenToBase(p,e),S=st.style;
  if(tool==='select'||tool==='editText'){if(!e.target.closest('.it')&&!e.target.closest('.hit')){select(null);const a=document.activeElement;if(a&&a.classList&&a.classList.contains('tx'))a.blur()}return}
  if(e.target.closest('.it')&&tool==='text')return;
  e.preventDefault();const a=document.activeElement;if(a&&a.blur)a.blur();
  if(tool==='text'){newText(p,b.x,b.y-S.size*.6);return}
  if(tool==='date'){newText(p,b.x,b.y-S.size*.6,today());setTool('select');return}
  if(tool==='place'){const P=st.pending;if(!P)return setTool('select');const it={id:nid(),type:'image',img:P.img,w:P.w,h:P.h,x:b.x-P.w/2,y:b.y-P.h/2};addItem(p,it);select(p.id,it.id);st.pending=null;setTool('select');return}
  if(tool==='note'){const it={id:nid(),type:'note',x:b.x-11,y:b.y-11,w:22,h:22,text:''};addItem(p,it,true);setTool('select');select(p.id,it.id);openNote(p,it);commit();return}
  if(tool==='check'||tool==='cross'){const s=Math.max(10,S.size*1.3);addItem(p,{id:nid(),type:tool,x:b.x-s/2,y:b.y-s/2,w:s,h:s,color:S.scolor,lw:Math.max(1.5,S.lw)});return}
  const E=pageEls.get(p.id);
  if(tool==='draw'){const pts=[[b.x,b.y]];const sv=svgEl(p.base.w,p.base.h,'');sv.style.zIndex=9;const pl=document.createElementNS(svgNS,'polyline');
    pl.setAttribute('fill','none');pl.setAttribute('stroke',S.scolor);pl.setAttribute('stroke-width',S.lw);pl.setAttribute('stroke-linecap','round');pl.setAttribute('stroke-linejoin','round');sv.append(pl);E.ov.append(sv);
    const mv=ev=>{const q=screenToBase(p,ev);const l=pts[pts.length-1];if(Math.hypot(q.x-l[0],q.y-l[1])<.6)return;pts.push([q.x,q.y]);pl.setAttribute('points',pts.map(q=>q.join(',')).join(' '))};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);sv.remove();if(pts.length<2)return;
      const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(1,Math.max(...xs)-x),h=Math.max(1,Math.max(...ys)-y);
      addItem(p,{id:nid(),type:'ink',x,y,w,h,pts:pts.map(q=>[(q[0]-x)/w,(q[1]-y)/h]),color:S.scolor,lw:S.lw})};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);return}
  // herramientas de arrastre (rectángulos y líneas)
  const pv=document.createElement('div');pv.className='prev';E.ov.append(pv);let c=b;
  const upd=()=>{pv.style.left=Math.min(b.x,c.x)+'px';pv.style.top=Math.min(b.y,c.y)+'px';pv.style.width=Math.abs(c.x-b.x)+'px';pv.style.height=Math.abs(c.y-b.y)+'px'};upd();
  const mv=ev=>{c=screenToBase(p,ev);upd()};
  const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);pv.remove();
    let x=Math.min(b.x,c.x),y=Math.min(b.y,c.y),w=Math.abs(c.x-b.x),h=Math.abs(c.y-b.y);const small=w<3&&h<3;
    const it={id:nid(),type:tool,x,y,w,h};
    if(tool==='line'){if(small){w=120;h=0;c={x:b.x+120,y:b.y}}it.dir=(c.x-b.x)*(c.y-b.y)>=0;it.w=Math.max(1,w);it.h=Math.max(1,h);if(small){it.x=b.x;it.y=b.y}it.color=S.scolor;it.lw=S.lw}
    else{if(small){const dw={highlight:[120,S.size*1.2],underline:[120,S.size*1.2],strike:[120,S.size*1.2],whiteout:[140,S.size*1.4],redact:[140,S.size*1.4],rect:[120,70],ellipse:[120,70]}[tool]||[100,30];it.x=b.x;it.y=b.y-dw[1]/2;it.w=dw[0];it.h=dw[1]}
      if(tool==='highlight'||tool==='underline'||tool==='strike')it.color=S.hcolor;
      if(tool==='underline'||tool==='strike')it.color=S.scolor;
      if(tool==='whiteout')it.color=S.ccolor;
      if(tool==='rect'||tool==='ellipse'){it.color=S.scolor;it.lw=S.lw}}
    addItem(p,it);if(!KEEP.includes(tool))setTool('select')};
  addEventListener('mousemove',mv);addEventListener('mouseup',up);
}

function getText(p){const k=p.s+':'+p.i;if(!tcCache.has(k))tcCache.set(k,(async()=>{const pg=await st.srcs[p.s].doc.getPage(p.i+1);const vp=pg.getViewport({scale:1});const tc=await pg.getTextContent();const items=[];

    items.push({idx,str:t.str,x:tx[4],y:tx[5],size,w:t.width,ang:Math.atan2(tx[1],tx[0]),fontName:t.fontName,family:(tc.styles[t.fontName]||{}).fontFamily||''})});
  return {items,pg}})());return tcCache.get(k)}

  for(const t of items){if(Math.abs(t.ang)>.02||p.edited.includes(t.idx))continue;const h=document.createElement('div');h.className='hit';h.title='Clic para editar este texto';
    h.style.cssText=`left:${t.x}px;top:${t.y-t.size*.92}px;width:${Math.max(2,t.w)}px;height:${t.size*1.18}px`;
    h.addEventListener('mousedown',e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();editHit(p,t)});frag.append(h)}

function fontMeta(pg,t){let name='';try{if(pg.commonObjs.has(t.fontName)){const f=pg.commonObjs.get(t.fontName);name=(f.name||'')+' '+(f.loadedName||'');if(f.bold)name+=' bold';if(f.italic)name+=' italic'}}catch(e){}

  if(/courier|mono|consol/i.test(all))family='Courier';else if(/times|roman|georgia|garamond|cambria|minion|book|palatino/i.test(all)||(/\bserif\b/i.test(t.family)&&!/sans/i.test(all)))family='Times';

async function sampleCanvas(p){const k=p.s+':'+p.i;if(!sampCache.has(k))sampCache.set(k,(async()=>{const pg=await st.srcs[p.s].doc.getPage(p.i+1);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const ctx=c.getContext('2d',{willReadFrequently:true});await pg.render({canvasContext:ctx,viewport:vp}).promise;return ctx})());return sampCache.get(k)}
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');

    const x0=clamp(Math.floor((box.x-2)*S),0,W-1),y0=clamp(Math.floor((box.y-2)*S),0,H-1),x1=clamp(Math.ceil((box.x+box.w+2)*S),0,W-1),y1=clamp(Math.ceil((box.y+box.h+2)*S),0,H-1);

/* ======================== construir el PDF ======================== */
function P(c,x,y){const {cb,r}=c,W=cb.width,H=cb.height;let X,Y;
  switch(r){case 90:X=y;Y=x;break;case 180:X=W-x;Y=y;break;case 270:X=W-y;Y=H-x;break;default:X=x;Y=H-y}return{x:cb.x+X,y:cb.y+Y}}
function cleanText(s,f){let o='';for(const ch of s.replace(/\t/g,'    ').replace(/\r/g,'')){try{f.encodeText(ch);o+=ch}catch(e){o+=ch==='“'||ch==='”'?'"':ch==='‘'||ch==='’'?"'":'?'}}return o}
async function drawItem(out,c,it,font,img){
  const R=degrees(c.r),col=it.color?hexRgb(it.color):rgb(0,0,0),lw=it.lw||2,op=it.opacity??1;
  const box=(x,y,w,h,o)=>{const q=P(c,x,y+h);c.pg.drawRectangle({x:q.x,y:q.y,width:w,height:h,rotate:R,...o})};
  const ln=(a,b)=>c.pg.drawLine({start:P(c,a[0],a[1]),end:P(c,b[0],b[1]),thickness:lw,color:col,opacity:op,lineCap:LineCapStyle.Round});
  switch(it.type){
    case 'text':{const f=await font(FONTS[it.font].std[(it.bold?1:0)+(it.italic?2:0)]),lh=it.size*1.2,asc=FONTS[it.font].asc*it.size,a=(it.angle||0)*Math.PI/180;
      it.text.split('\n').forEach((l,i)=>{const s=cleanText(l,f);if(!s.trim())return;const oy=asc+i*lh;const q=P(c,it.x-Math.sin(a)*oy,it.y+Math.cos(a)*oy);
        c.pg.drawText(s,{x:q.x,y:q.y,size:it.size,font:f,color:col,rotate:degrees(c.r-(it.angle||0)),opacity:op})});break}
    case 'whiteout':box(it.x,it.y,it.w,it.h,{color:col});break;
    case 'redact':box(it.x,it.y,it.w,it.h,{color:rgb(0,0,0)});break;
    case 'highlight':box(it.x,it.y,it.w,it.h,{color:col,opacity:.45,blendMode:BlendMode.Multiply});break;
    case 'underline':case 'strike':{const t=Math.max(.75,it.h*.07);box(it.x,it.type==='underline'?it.y+it.h-t:it.y+it.h*.55-t/2,it.w,t,{color:col,opacity:op});break}
    case 'rect':box(it.x+lw/2,it.y+lw/2,Math.max(1,it.w-lw),Math.max(1,it.h-lw),{borderColor:col,borderWidth:lw,borderOpacity:op});break;
    case 'ellipse':{const q=P(c,it.x+it.w/2,it.y+it.h/2),sx=Math.max(1,(it.w-lw)/2),sy=Math.max(1,(it.h-lw)/2);c.pg.drawEllipse({x:q.x,y:q.y,xScale:c.r%180?sy:sx,yScale:c.r%180?sx:sy,borderColor:col,borderWidth:lw,borderOpacity:op});break}
    case 'line':{const a=it.dir?[it.x,it.y]:[it.x,it.y+it.h],b=it.dir?[it.x+it.w,it.y+it.h]:[it.x+it.w,it.y];ln(a,b);break}
    case 'ink':{const pts=it.pts.map(q=>[it.x+q[0]*it.w,it.y+q[1]*it.h]);for(let i=1;i<pts.length;i++)ln(pts[i-1],pts[i]);break}
    case 'check':{const p=[[.1,.55],[.4,.85],[.9,.15]].map(q=>[it.x+q[0]*it.w,it.y+q[1]*it.h]);ln(p[0],p[1]);ln(p[1],p[2]);break}
    case 'cross':{const f=(a,b)=>[it.x+a*it.w,it.y+b*it.h];ln(f(.15,.15),f(.85,.85));ln(f(.85,.15),f(.15,.85));break}
    case 'image':{const e=await img(it.img);const q=P(c,it.x,it.y+it.h);c.pg.drawImage(e,{x:q.x,y:q.y,width:it.w,height:it.h,rotate:R,opacity:op});break}
    case 'note':{const a=P(c,it.x,it.y),b=P(c,it.x+20,it.y+20);
      const ann=out.context.obj({Type:'Annot',Subtype:'Text',Rect:[Math.min(a.x,b.x),Math.min(a.y,b.y),Math.max(a.x,b.x),Math.max(a.y,b.y)],Contents:PDFHexString.fromText(it.text||''),Name:'Comment',C:[1,.82,.25],T:PDFHexString.fromText('Comentario'),F:4,Open:false});
      c.pg.node.addAnnot(out.context.register(ann));break}
  }
}
/* reparar PDFs con estructura incompleta (p. ej. índice sin /Type /Catalog) */
async function repairDoc(d){
  if(typeof d.catalog.Pages==='function')return d;
  const {PDFCatalog,PDFPageTree,PDFPageLeaf,PDFRef}=PDFLib;
  const ctx=d.context,root=ctx.trailerInfo.Root;
  const conv=(ref,Cls,type)=>{const n=ctx.lookup(ref);if(!n||!n.dict||n instanceof Cls)return n;const m=new Map(n.dict);m.set(PDFName.of('Type'),PDFName.of(type));
    const nn=Cls.fromMapWithContext(m,ctx);if(ref instanceof PDFRef)ctx.assign(ref,nn);return nn};
  const cat=conv(root,PDFCatalog,'Catalog');if(!cat)throw new Error('El PDF no tiene índice de páginas');d.catalog=cat;
  const seen=new Set();const walk=ref=>{if(!(ref instanceof PDFRef)||seen.has(ref.tag))return;seen.add(ref.tag);const n=ctx.lookup(ref);if(!n||!n.dict)return;
    const kids=n.get(PDFName.of('Kids'));if(kids){conv(ref,PDFPageTree,'Pages');const arr=ctx.lookup(kids);for(let i=0;i<arr.size();i++)walk(arr.get(i))}else conv(ref,PDFPageLeaf,'Page')};
  walk(cat.get(PDFName.of('Pages')));
  if(typeof d.catalog.Pages!=='function')throw new Error('No se pudo reparar el PDF');return d}
/* último recurso: convertir la página en imagen de alta calidad */
async function rasterPage(out,p){
  const pg=await st.srcs[p.s].doc.getPage(p.i+1),v1=pg.getViewport({scale:1,rotation:0}),vp=pg.getViewport({scale:200/72,rotation:0});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:vp}).promise;
  const jpg=await out.embedJpg(await (await fetch(c.toDataURL('image/jpeg',.92))).arrayBuffer());
  const np=out.addPage([v1.width,v1.height]);np.drawImage(jpg,{x:0,y:0,width:v1.width,height:v1.height});np.__raster=true;return np}
async function buildPdf(pages){
  const out=await PDFDocument.create(),libs={};
  const lib=async si=>{if(libs[si]!==undefined)return libs[si];const S=st.srcs[si];let d=null;
    for(const opt of [{password:S.pwd||''},{ignoreEncryption:true}]){
      try{let t=await PDFDocument.load(S.bytes,{...opt,updateMetadata:false});t=await repairDoc(t);t.getPages();d=t;break}catch(e){console.warn('pdf-lib no pudo leer el archivo',e)}}
    return libs[si]=d};
  const need={};pages.forEach((p,k)=>(need[p.s]=need[p.s]||[]).push(k));const copied=[];
  for(const si in need){const d=await lib(si),idx=need[si];
    if(d){try{const cps=await out.copyPages(d,idx.map(k=>pages[k].i));idx.forEach((k,j)=>copied[k]=cps[j]);continue}catch(e){console.warn('copyPages falló',e)}}
    for(const k of idx)copied[k]=await rasterPage(out,pages[k]);st.rasterWarn=true}
  const fc={},icache={};const font=async n=>fc[n]||(fc[n]=await out.embedFont(StandardFonts[n]));
  const img=async key=>icache[key]||(icache[key]=await (async()=>{const d=st.imgs[key];const b=await (await fetch(d)).arrayBuffer();return d.startsWith('data:image/jpeg')?out.embedJpg(b):out.embedPng(b)})());
  for(let k=0;k<pages.length;k++){const p=pages[k],pg=copied[k].__raster?copied[k]:out.addPage(copied[k]);pg.setRotation(degrees((p.base.r+p.rot)%360));
    const c={pg,cb:pg.getCropBox(),r:p.base.r};
    for(const it of p.items)await drawItem(out,c,it,font,img);
    if(p.ocr&&p.ocr.length){const f=await font('Helvetica');for(const w of p.ocr){const s=cleanText(w.t,f);if(!s.trim())continue;let size=w.h*.9;const tw=f.widthOfTextAtSize(s,size);if(tw>0)size=clamp(size*w.w/tw,w.h*.4,w.h*1.6);
      const q=P(c,w.x,w.y+w.h*.8);pg.drawText(s,{x:q.x,y:q.y,size,font:f,opacity:0,rotate:degrees(c.r)})}}
  }
  return out;
}
async function finalBytes(pages=st.pages,{secure=true}={}){
  let doc=await buildPdf(pages);
  const red=pages.map((p,k)=>p.items.some(i=>i.type==='redact')?k:-1).filter(k=>k>=0);
  if(red.length){
    const pj=await pdfjsLib.getDocument({data:await doc.save()}).promise,fin=await PDFDocument.create();
    const keep=pages.map((_,k)=>k).filter(k=>!red.includes(k));const cps=keep.length?await fin.copyPages(doc,keep):[];
    for(let k=0;k<pages.length;k++){
      if(!red.includes(k)){fin.addPage(cps[keep.indexOf(k)]);continue}
      const pg=await pj.getPage(k+1),v1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:200/72});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:x,viewport:vp}).promise;
      const jpg=await fin.embedJpg(await (await fetch(cv.toDataURL('image/jpeg',.9))).arrayBuffer());const np=fin.addPage([v1.width,v1.height]);np.drawImage(jpg,{x:0,y:0,width:v1.width,height:v1.height})}
    doc=fin}
  const M=st.meta;doc.setTitle(M.title||baseName());if(M.author)doc.setAuthor(M.author);if(M.subject)doc.setSubject(M.subject);if(M.keywords)doc.setKeywords(M.keywords.split(',').map(s=>s.trim()).filter(Boolean));
  doc.setProducer('Editor PDF');doc.setModificationDate(new Date());
  if(secure&&st.security){const s=st.security;doc.encrypt({userPassword:s.user,ownerPassword:s.user+'#own'+Math.random().toString(36).slice(2,8),permissions:{printing:s.noPrint?false:'highResolution',modifying:!s.noEdit,copying:!s.noCopy,annotating:!s.noEdit,fillingForms:!s.noEdit,contentAccessibility:true,documentAssembly:!s.noEdit}})}
  return await doc.save();
}
async function save(as){
  if(!need())return;const a=document.activeElement;if(a&&a.blur)a.blur();
  busy('Guardando...');await tick();let bytes;
  try{bytes=await finalBytes()}catch(e){console.error(e);busy(false);return alert('No se pudo generar el PDF: '+e.message)}
  busy(false);
  const blob=new Blob([bytes],{type:'application/pdf'});
  try{
    if(!as&&st.handle&&st.handle.createWritable){const w=await st.handle.createWritable();await w.write(blob);await w.close();done();return}
    if(window.showSaveFilePicker){const h=await showSaveFilePicker({suggestedName:as?baseName()+'_editado.pdf':st.name,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();st.handle=h;st.name=h.name;done();return}
  }catch(e){if(e.name==='AbortError')return;console.warn(e)}
  download(blob,as?baseName()+'_editado.pdf':st.name.replace(/\.pdf$/i,'')+(st.name.endsWith('_editado.pdf')?'':'_editado')+'.pdf');done();
  function done(){st.dirty=false;updateUndo();$('#docName').textContent=st.name;toast('Documento guardado'+(st.security?' con contraseña':'')+(st.rasterWarn?'. Algunas páginas dañadas se guardaron como imagen':''),st.rasterWarn?5000:2600);st.rasterWarn=false}
}
async function doPrint(){if(!need())return;busy('Preparando impresión...');await tick();
  try{const bytes=await finalBytes(st.pages,{secure:false});const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    let f=$('#printFrame');if(f)f.remove();f=document.createElement('iframe');f.id='printFrame';f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
    f.onload=()=>setTimeout(()=>{busy(false);try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(url)}},400);f.src=url;document.body.append(f);
    setTimeout(()=>busy(false),5000)}catch(e){busy(false);alert('No se pudo preparar la impresión: '+e.message)}}

function exportDialog(){
  const m=modal('Exportar PDF',`
    <div class="fld"><label>Convertir a</label><select id="exF"><option value="doc">Documento de Word (.doc) — solo texto</option><option value="txt">Texto sin formato (.txt)</option><option value="png">Imágenes PNG (.zip)</option><option value="jpg">Imágenes JPG (.zip)</option></select></div>
    <div class="row"><div class="fld"><label>Páginas</label><select id="exP"><option value="all">Todas (${st.pages.length})</option><option value="cur">Solo la actual (${st.pi+1})</option></select></div>
    <div class="fld" id="exRes"><label>Resolución de imagen</label><select id="exD"><option value="96">Baja (96 ppp)</option><option value="150" selected>Media (150 ppp)</option><option value="300">Alta (300 ppp)</option></select></div></div>
    <div class="note">La exportación incluye tus cambios. Si el PDF es una foto o escaneo, primero usa "Escanear y OCR" para poder sacar el texto.</div>`,
    `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="exOk">Exportar</button>`);
  const f=m.querySelector('#exF'),res=m.querySelector('#exRes');const upd=()=>res.style.visibility=/png|jpg/.test(f.value)?'visible':'hidden';f.onchange=upd;upd();
  m.querySelector('#exOk').onclick=async()=>{const fmt=f.value,pages=m.querySelector('#exP').value==='cur'?[st.pages[st.pi]]:st.pages,dpi=+m.querySelector('#exD').value;m.close();
    busy('Exportando...');await tick();
    try{const pj=await pdfjsLib.getDocument({data:await finalBytes(pages,{secure:false})}).promise;
      if(fmt==='png'||fmt==='jpg'){const zip=new JSZip();for(let i=1;i<=pj.numPages;i++){$('#busyMsg').textContent=`Exportando página ${i} de ${pj.numPages}...`;const pg=await pj.getPage(i),vp=pg.getViewport({scale:dpi/72});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;
          const b=await new Promise(r=>c.toBlob(r,fmt==='png'?'image/png':'image/jpeg',.92));if(pj.numPages===1){busy(false);return download(b,`${baseName()}.${fmt}`)}zip.file(`${baseName()}_pag${String(i).padStart(3,'0')}.${fmt}`,b)}
        download(await zip.generateAsync({type:'blob'}),baseName()+'_imagenes.zip')}
      else{const pagesTxt=[];for(let i=1;i<=pj.numPages;i++){const pg=await pj.getPage(i),tc=await pg.getTextContent();pagesTxt.push(linesOf(tc.items))}
        if(fmt==='txt')download(new Blob([pagesTxt.map(l=>l.join('\n')).join('\n\n\f')],{type:'text/plain;charset=utf-8'}),baseName()+'.txt');
        else{const body=pagesTxt.map(ls=>ls.map(l=>`<p>${esc(l)||'&nbsp;'}</p>`).join('')).join('<br style="page-break-before:always">');
          download(new Blob(['﻿'+`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(baseName())}</title><style>body{font-family:Calibri,Arial;font-size:11pt}p{margin:0 0 4pt}</style></head><body>${body}</body></html>`],{type:'application/msword'}),baseName()+'.doc')}}
      toast('Exportación lista')}catch(e){console.error(e);alert('No se pudo exportar: '+e.message)}finally{busy(false)}}}
function linesOf(items){const rows=[];for(const t of items){if(!t.str)continue;const y=t.transform[5],x=t.transform[4],h=Math.hypot(t.transform[2],t.transform[3])||10;let r=rows.find(r=>Math.abs(r.y-y)<h*.5);if(!r){r={y,h,parts:[]};rows.push(r)}r.parts.push({x,s:t.str,w:t.width})}
  rows.sort((a,b)=>b.y-a.y);return rows.map(r=>{r.parts.sort((a,b)=>a.x-b.x);let s='',end=null;for(const p of r.parts){if(end!=null&&p.x-end>r.h*.25&&!s.endsWith(' '))s+=' ';s+=p.s;end=p.x+p.w}return s.replace(/\s+$/,'')})}

/* ======================== OCR ======================== */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.append(s)})}
function ocrDialog(){
  const m=modal('Escanear y OCR',`
    <p style="margin-top:0">Reconoce el texto de páginas escaneadas o fotos para que puedas buscarlo, copiarlo y exportarlo.</p>
    <div class="row"><div class="fld"><label>Idioma del documento</label><select id="oL"><option value="spa">Español</option><option value="eng">Inglés</option><option value="spa+eng">Español e inglés</option></select></div>
    <div class="fld"><label>Páginas</label><select id="oP"><option value="cur">Solo la actual (${st.pi+1})</option><option value="all">Todas (${st.pages.length})</option></select></div></div>
    <div id="oRes" hidden><div class="fld"><label>Texto reconocido</label><textarea id="oTxt" rows="10" readonly></textarea></div></div>
    <div class="note">La primera vez descarga el modelo del idioma (unos segundos). El texto queda incrustado de forma invisible en el PDF al guardar.</div>`,
    `<button class="btn" data-close>Cerrar</button><button class="btn" id="oCopy" hidden>Copiar texto</button><button class="btn pri" id="oOk">Reconocer texto</button>`);
  m.querySelector('#oCopy').onclick=()=>{navigator.clipboard.writeText(m.querySelector('#oTxt').value);toast('Texto copiado')};
  m.querySelector('#oOk').onclick=async()=>{const lang=m.querySelector('#oL').value,pages=m.querySelector('#oP').value==='cur'?[st.pages[st.pi]]:st.pages;
    busy('Cargando motor de OCR...');let worker;
    try{if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      worker=await Tesseract.createWorker(lang,1,{logger:l=>{if(l.status==='recognizing text')$('#busyMsg').textContent=`Reconociendo texto... ${Math.round(l.progress*100)}%`}});
      let all='';for(let n=0;n<pages.length;n++){const p=pages[n];$('#busyMsg').textContent=`Reconociendo página ${n+1} de ${pages.length}...`;
        const pg=await st.srcs[p.s].doc.getPage(p.i+1),sc=2.5,vp=pg.getViewport({scale:sc});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:x,viewport:vp}).promise;const {data}=await worker.recognize(c);
        p.ocr=(data.words||[]).filter(w=>w.confidence>30&&w.text.trim()).map(w=>({x:w.bbox.x0/sc,y:w.bbox.y0/sc,w:(w.bbox.x1-w.bbox.x0)/sc,h:(w.bbox.y1-w.bbox.y0)/sc,t:w.text}));
        all+=(pages.length>1?`--- Página ${st.pages.indexOf(p)+1} ---\n`:'')+data.text.trim()+'\n\n'}
      commit();m.querySelector('#oRes').hidden=false;m.querySelector('#oTxt').value=all.trim()||'(No se encontró texto)';m.querySelector('#oCopy').hidden=false;toast('OCR completado')}
    catch(e){console.error(e);alert('No se pudo hacer el OCR: '+e.message+'\nRevisa tu conexión a internet.')}
    finally{if(worker)worker.terminate();busy(false)}}}

/* ======================== organizar ======================== */
let orgSel=new Set();
function openOrganize(){st.view='org';$('#home').hidden=true;$('#pages').hidden=true;$('#org').hidden=false;$('#left').classList.add('closed');st.panel='organize';renderTools();$('#ctx').innerHTML='';orgSel=new Set();renderOrg()}
function renderOrg(){const o=$('#org');const n=orgSel.size;
  o.innerHTML=`<div class="orgbar"><span class="ctitle">Organizar páginas</span>
    ${abtn('o_ins','filePlus','Insertar archivo')}${abtn('o_blank','note','Página en blanco')}
    <span class="sep"></span><span style="color:var(--tx2);margin-right:4px">${n?n+' seleccionada(s)':'Selecciona páginas para:'}</span>
    ${abtn('o_rl','rotccw','Rotar izq.')}${abtn('o_rr','rotcw','Rotar der.')}${abtn('o_del','trash','Eliminar')}${abtn('o_ext','export','Extraer')}
    <span class="sep"></span>${abtn('o_split','split','Dividir')}${abtn('o_all','check',n===st.pages.length?'Quitar selección':'Seleccionar todo')}
    <div class="grow"></div>${abtn('o_close','x','Cerrar',1)}</div><div class="grid"></div>`;
  const g=o.querySelector('.grid');
  st.pages.forEach((p,k)=>{const d=document.createElement('div');d.className='card'+(orgSel.has(p.id)?' on':'');
    d.innerHTML=`<input type="checkbox"${orgSel.has(p.id)?' checked':''}><div class="cact"><button class="ib" data-o="l" title="Rotar a la izquierda">${ic('rotccw',16)}</button><button class="ib" data-o="r" title="Rotar a la derecha">${ic('rotcw',16)}</button><button class="ib" data-o="b" title="Insertar página en blanco después">${ic('filePlus',16)}</button><button class="ib" data-o="d" title="Eliminar">${ic('trash',16)}</button></div><div class="cc"></div><span class="nm">${k+1}</span>`;
    const cb=d.querySelector('input');cb.onchange=()=>{cb.checked?orgSel.add(p.id):orgSel.delete(p.id);renderOrg()};
    d.querySelectorAll('[data-o]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.o;if(a==='l')rotatePages([p],-90);if(a==='r')rotatePages([p],90);if(a==='b')insertBlank(st.pages.indexOf(p)+1);
      if(a==='d'){if(st.pages.length<2)return toast('Debe quedar al menos una página');st.pages.splice(st.pages.indexOf(p),1);orgSel.delete(p.id);commit();syncPages(false);renderOrg()}});
    d.ondblclick=()=>{showDoc();goPage(st.pages.indexOf(p))};
    d.onclick=e=>{if(e.target.closest('button,input'))return;if(e.ctrlKey||e.metaKey||e.shiftKey){orgSel.has(p.id)?orgSel.delete(p.id):orgSel.add(p.id)}else{orgSel=new Set([p.id])}renderOrg()};
    dndReorder(d,p.id,renderOrg);g.append(d);fillThumb(d.querySelector('.cc'),p,Math.round(150*Math.min(1,disp(p).w/disp(p).h*1.33)))});
}
const selPages=()=>st.pages.filter(p=>orgSel.has(p.id));
Object.assign(ACT,{
  o_close:()=>{st.panel=null;renderTools();showDoc();syncPages(false);applyFit(true)},
  o_ins:async()=>{const fs=await pickFiles('.pdf,application/pdf,image/*',true);if(!fs.length)return;const s=selPages();const at=s.length?st.pages.indexOf(s[s.length-1])+1:st.pages.length;appendFiles(fs,at)},
  o_blank:()=>{const s=selPages();insertBlank(s.length?st.pages.indexOf(s[s.length-1])+1:st.pages.length)},
  o_rl:()=>{const s=selPages();if(!s.length)return toast('Selecciona al menos una página');rotatePages(s,-90)},
  o_rr:()=>{const s=selPages();if(!s.length)return toast('Selecciona al menos una página');rotatePages(s,90)},
  o_del:()=>{const s=selPages();if(!s.length)return toast('Selecciona al menos una página');if(s.length>=st.pages.length)return toast('No puedes eliminar todas las páginas');if(!confirm(`¿Eliminar ${s.length} página(s)?`))return;st.pages=st.pages.filter(p=>!orgSel.has(p.id));orgSel.clear();commit();syncPages(false);renderOrg()},
  o_all:()=>{orgSel=orgSel.size===st.pages.length?new Set():new Set(st.pages.map(p=>p.id));renderOrg()},
  o_ext:async()=>{const s=selPages();if(!s.length)return toast('Selecciona las páginas que quieres extraer');busy('Extrayendo...');try{download(new Blob([await finalBytes(s,{secure:false})],{type:'application/pdf'}),`${baseName()}_extracto.pdf`);toast(s.length+' página(s) extraída(s)')}finally{busy(false)}},
  o_split:()=>{const m=modal('Dividir documento',`<div class="fld"><label>Crear un PDF cada cuántas páginas</label><input type="number" id="spN" value="1" min="1" max="${st.pages.length}"></div><div class="note">Con ${st.pages.length} páginas se generarán varios PDF dentro de un archivo .zip.</div>`,`<button class="btn" data-close>Cancelar</button><button class="btn pri" id="spOk">Dividir</button>`);
    m.querySelector('#spOk').onclick=async()=>{const n=Math.max(1,+m.querySelector('#spN').value||1);m.close();busy('Dividiendo...');try{const zip=new JSZip();for(let i=0;i<st.pages.length;i+=n){const part=st.pages.slice(i,i+n);zip.file(`${baseName()}_${String(i+1).padStart(3,'0')}-${String(i+part.length).padStart(3,'0')}.pdf`,await finalBytes(part,{secure:false}))}
      download(await zip.generateAsync({type:'blob'}),baseName()+'_dividido.zip');toast('Documento dividido')}finally{busy(false)}}}
});

/* ======================== buscar ======================== */
let hits=[],hitI=-1;
const norm=s=>[...s].map(ch=>ch.normalize('NFD')[0].toLowerCase()).join('');
function openFind(){if(!need())return;$('#find').hidden=false;const i=$('#findIn');i.focus();i.select()}
function closeFind(){$('#find').hidden=true;hits=[];hitI=-1;$$('.shit').forEach(h=>h.remove());$('#findCnt').textContent=''}
async function doSearch(q){hits=[];hitI=-1;$$('.shit').forEach(h=>h.remove());q=norm(q.trim());if(!q){$('#findCnt').textContent='';return}
  for(const p of st.pages){const {items}=await getText(p);
    const scan=(str,x,y,w,size)=>{const s=norm(str),cw=w/Math.max(1,str.length);let k=s.indexOf(q);while(k>=0){hits.push({pid:p.id,x:x+k*cw,y,w:q.length*cw,h:size});k=s.indexOf(q,k+1)}};
    items.forEach(t=>{if(Math.abs(t.ang)<.02)scan(t.str,t.x,t.y-t.size*.92,t.w,t.size*1.18)});
    (p.ocr||[]).forEach(w=>scan(w.t,w.x,w.y,w.w,w.h));
    p.items.filter(i=>i.type==='text').forEach(i=>i.text.split('\n').forEach((l,j)=>{const w=measure(l,i);scan(l,i.x,i.y+j*i.size*1.2,w,i.size*1.2)}))}
  st.pages.forEach(markSearch);$('#findCnt').textContent=hits.length?`0 de ${hits.length}`:'Sin resultados';if(hits.length)nextHit(1)}
function markSearch(p){const E=pageEls.get(p.id);if(!E)return;E.ov.querySelectorAll('.shit').forEach(h=>h.remove());hits.forEach((h,i)=>{if(h.pid!==p.id)return;const d=document.createElement('div');d.className='shit'+(i===hitI?' cur':'');d.style.cssText=`left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px`;E.ov.append(d)})}
function nextHit(d){if(!hits.length)return;hitI=(hitI+d+hits.length)%hits.length;const h=hits[hitI],p=pageById(h.pid);st.pages.forEach(markSearch);$('#findCnt').textContent=`${hitI+1} de ${hits.length}`;
  const E=pageEls.get(p.id);const q=baseToDisp(p,h.x,h.y);viewer.scrollTop=E.el.offsetTop+q.y*st.z-viewer.clientHeight/3;viewer.scrollLeft=Math.max(0,E.el.offsetLeft+q.x*st.z-viewer.clientWidth/2)}
let sT;$('#findIn').addEventListener('input',e=>{clearTimeout(sT);sT=setTimeout(()=>doSearch(e.target.value),250)});
$('#findIn').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')nextHit(e.shiftKey?-1:1);if(e.key==='Escape')closeFind()});
$('#findNext').onclick=()=>nextHit(1);$('#findPrev').onclick=()=>nextHit(-1);$('#findClose').onclick=closeFind;

/* ======================== teclado y arrastrar archivos ======================== */
document.addEventListener('keydown',e=>{
  const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]');const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(c&&k==='s'){e.preventDefault();save(e.shiftKey);return}
  if(c&&k==='o'){e.preventDefault();openDialog();return}
  if(c&&k==='p'){e.preventDefault();doPrint();return}
  if(c&&k==='f'){e.preventDefault();openFind();return}
  if(typing||$('.modal'))return;
  if(c&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(c&&k==='y'){e.preventDefault();redo();return}
  if(c&&(k==='+'||k==='=')){e.preventDefault();zoomStep(1);return}
  if(c&&k==='-'){e.preventDefault();zoomStep(-1);return}
  if(c&&k==='d'){e.preventDefault();ACT.dup();return}
  if(e.key==='Escape'){if(!$('#find').hidden)closeFind();setTool('select');select(null);return}
  if((e.key==='Delete'||e.key==='Backspace')&&st.sel){e.preventDefault();ACT.delsel();return}
  if(st.sel&&e.key.startsWith('Arrow')){e.preventDefault();const it=selItem(),p=pageById(st.sel.pid),s=e.shiftKey?10:1;if(e.key==='ArrowLeft')it.x-=s;if(e.key==='ArrowRight')it.x+=s;if(e.key==='ArrowUp')it.y-=s;if(e.key==='ArrowDown')it.y+=s;refreshItem(p,it);window._nt&&clearTimeout(window._nt);window._nt=setTimeout(commit,400);return}
  if(!c&&k==='v')setTool('select');if(!c&&k==='h')setTool('hand');
  if(!c&&(e.key==='PageDown'))goPage(st.pi+1);if(!c&&(e.key==='PageUp'))goPage(st.pi-1);
});
let dragDepth=0,dropEl=null;
const isFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(!isFiles(e))return;e.preventDefault();dragDepth++;if(!dropEl){dropEl=document.createElement('div');dropEl.className='dropall';dropEl.textContent=hasDoc()?'Suelta para agregar al documento':'Suelta para abrir';document.body.append(dropEl)}});
window.addEventListener('dragover',e=>{if(isFiles(e))e.preventDefault()});
window.addEventListener('dragleave',e=>{if(!isFiles(e))return;if(--dragDepth<=0){dragDepth=0;dropEl&&dropEl.remove();dropEl=null}});
window.addEventListener('drop',e=>{if(!isFiles(e))return;e.preventDefault();dragDepth=0;dropEl&&dropEl.remove();dropEl=null;const fs=[...e.dataTransfer.files];if(!fs.length)return;
  if(hasDoc()){if(confirm('¿Agregar estos archivos al final del documento abierto?\n\nAceptar = agregar · Cancelar = abrir como documento nuevo'))appendFiles(fs);else openNew(fs)}else openNew(fs)});
window.addEventListener('beforeunload',e=>{if(st.dirty&&hasDoc()){e.preventDefault();e.returnValue=''}});

/* ======================== inicio ======================== */
paintIcons();renderTools();showHome();updateUndo();updateNav();
